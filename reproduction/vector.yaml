data_dir: /var/lib/vector

# Kafka source with acknowledgements enabled
sources:
  kafka_source:
    type: kafka
    bootstrap_servers: "kafka:29092"
    group_id: "vector-test-group"
    topics:
      - "test-topic"
    auto_offset_reset: "earliest"
    
    # CRITICAL: Acknowledgements must be enabled to reproduce the bug
    acknowledgements:
      enabled: true
    
    # Commit interval - how often Kafka commits offsets
    commit_interval_ms: 5000
    
    decoding:
      codec: json

# HTTP sink that will receive events
sinks:
  http_sink:
    type: http
    inputs:
      - kafka_source
    uri: "http://mock-sink:8080/events"
    encoding:
      codec: json
    
    # Authentication header - this will be controlled by the test script
    # The test script will edit this file to change the token (triggering a config reload)
    auth:
      strategy: bearer
      token: "valid-token"
    
    # Batch settings
    batch:
      max_events: 10
      timeout_secs: 1
    
    # Request settings
    request:
      retry_attempts: 0  # Don't retry - we want to see immediate failures

