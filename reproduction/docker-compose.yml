version: '3.8'

services:
  # Kafka and Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # Simple HTTP server that simulates auth errors
  mock-sink:
    image: python:3.11-slim
    ports:
      - "8080:8080"
    volumes:
      - ./mock_sink.py:/app/mock_sink.py
    working_dir: /app
    command: python mock_sink.py
    environment:
      - PYTHONUNBUFFERED=1

  # Vector - using DockerHub image
  vector-dockerhub:
    image: timberio/vector:0.52.0-debian
    platform: linux/arm64
    depends_on:
      - kafka
      - mock-sink
    volumes:
      - ./good_token.yaml:/etc/vector/source_configs/good_token.yaml:ro
      - ./bad_token.yaml:/etc/vector/source_configs/bad_token.yaml:ro
      - vector-config:/etc/vector/configs
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while [ ! -f /etc/vector/configs/vector.yaml ]; do
          echo 'Waiting for config...'
          sleep 1
        done
        exec /usr/bin/vector --config /etc/vector/configs/vector.yaml --watch-config -vvv
    environment:
      - VECTOR_LOG=trace
      - RUST_BACKTRACE=full
    profiles:
      - dockerhub

  # Vector - using locally-built binary
  vector-local:
    build:
      context: ..
      dockerfile: reproduction/Dockerfile.local
    platform: linux/arm64
    depends_on:
      - kafka
      - mock-sink
    volumes:
      - ./good_token.yaml:/etc/vector/source_configs/good_token.yaml:ro
      - ./bad_token.yaml:/etc/vector/source_configs/bad_token.yaml:ro
      - vector-config:/etc/vector/configs
    command:
      - /bin/sh
      - -c
      - |
        while [ ! -f /etc/vector/configs/vector.yaml ]; do
          echo 'Waiting for config...'
          sleep 1
        done
        exec /usr/local/bin/vector --config /etc/vector/configs/vector.yaml --watch-config -vvv
    environment:
      - VECTOR_LOG=trace
      - RUST_BACKTRACE=full
    profiles:
      - local

volumes:
  vector-config:

